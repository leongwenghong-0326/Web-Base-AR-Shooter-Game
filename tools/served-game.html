<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0f14">
<title>Play — AR GAME Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/game.css">
<script src="/ar_shooter_game/assets/vendor/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "/ar_shooter_game/assets/vendor/three/three.module.js",
    "three/addons/": "/ar_shooter_game/assets/vendor/three/examples/jsm/",
    "mindar-image-three": "/ar_shooter_game/assets/vendor/mindar/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body class="game-page">
  <div id="ar-root"></div>

  <div id="startGate" class="start-gate">
    <div class="start-card">
      <h1>AR Shooter</h1>
      <p>Press Start AR to request the rear camera. Point at the printed/displayed target to begin.</p>
              <div class="btn-row" style="justify-content:center">
          <button class="btn btn-primary interactive" type="button" id="btnStartAr">Start AR</button>
          <a class="btn btn-ghost" href="index.php">Home</a>
        </div>
            <div id="startError" class="status err hidden"></div>
    </div>
  </div>

  <div id="gameOverlay" class="game-overlay hidden">
    <div class="hud" id="hud">
      <div class="hud-item"><span class="label">Score</span><span class="value" id="hudScore">0</span></div>
      <div class="hud-item"><span class="label">Wave</span><span class="value" id="hudWave">1</span></div>
      <div class="hud-item"><span class="label">HP</span><span class="value" id="hudHp">5</span></div>
      <div class="hud-item"><span class="label">Ammo</span><span class="value" id="hudAmmo">30/30</span></div>
    </div>
    <div class="crosshair" id="crosshair"></div>
    <div class="banner" id="banner"></div>
    <button class="ctrl-btn interactive" type="button" id="btn-reload">Reload</button>
    <button class="ctrl-btn interactive" type="button" id="btn-fire">Fire</button>
  </div>

  <div id="gameOver" class="game-over hidden">
    <div class="over-card">
      <h1>Game Over</h1>
      <p>Score: <strong id="overScore">0</strong><br>Wave reached: <strong id="overWave">1</strong></p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn-primary interactive" type="button" id="btnRestart">Restart</button>
        <a class="btn btn-ghost" href="index.php">Home</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    window.AR_GAME_CONFIG = {
      mindUrl: "assets/targets/targets.mind?v=1789437430",
      mindReady: true,
      modelsApi: 'api/models.php',
      assetBase: "/ar_shooter_game"    };
    window.__AR_GAME_READY = false;

    function showBootError(msg) {
      var err = document.getElementById('startError');
      if (!err) return;
      err.classList.remove('hidden');
      err.textContent = msg;
    }

    document.addEventListener('DOMContentLoaded', function () {
      var btn = document.getElementById('btnStartAr');
      if (!btn) return;
      btn.addEventListener('click', function () {
        if (window.__AR_GAME_READY && typeof window.__AR_startAR === 'function') return;
        showBootError(window.__AR_GAME_LOAD_ERROR || 'Loading game scripts... please wait a moment, then tap again.');
      }, true);
    });
  </script>
  <script type="module">
    const mainUrl = "/ar_shooter_game/assets/js/main.js?v=1789445200";
    try {
      await import(mainUrl);
      if (!window.__AR_GAME_READY) {
        window.__AR_GAME_LOAD_ERROR = 'Game module loaded but did not initialize.';
        document.getElementById('startError')?.classList.remove('hidden');
        if (document.getElementById('startError')) {
          document.getElementById('startError').textContent = window.__AR_GAME_LOAD_ERROR;
        }
      }
    } catch (e) {
      console.error(e);
      window.__AR_GAME_LOAD_ERROR = 'Script load error: ' + (e && e.message ? e.message : String(e));
      const err = document.getElementById('startError');
      if (err) {
        err.classList.remove('hidden');
        err.textContent = window.__AR_GAME_LOAD_ERROR;
      }
    }
  </script>
</body>
</html>
